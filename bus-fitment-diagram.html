<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Parts Fitment Diagram — First Bus</title>
  <style>
    :root {
      --fb-magenta: #E4007C;
      --fb-navy:    #1D2B5F;
      --zone-engine:  #B41E2A;
      --zone-brakes:  #2E6B9E;
      --zone-doors:   #C07800;
      --zone-elec:    #007A6E;
      --zone-general: #606878;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #F4F5F7; color: #222; font-size: 14px; }
    .hidden { display: none !important; }

    #app-header { background: var(--fb-navy); color: white; position: sticky; top: 0; z-index: 10; }
    .header-inner { display: flex; align-items: stretch; max-width: 1400px; margin: 0 auto; }
    .brand-bar { width: 5px; background: var(--fb-magenta); flex-shrink: 0; }
    .header-text { padding: 12px 20px; }
    .header-sup { display: block; font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
    .header-title { font-size: 20px; font-weight: 600; }

    #app-main { max-width: 1400px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: white; border-radius: 8px; border: 1px solid #DDE1E8; padding: 16px 20px; }

    .upload-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px; }
    .file-group { display: flex; flex-direction: column; gap: 5px; }
    .file-group label { font-size: 12px; font-weight: 600; color: var(--fb-navy); text-transform: uppercase; letter-spacing: 0.05em; }
    .file-group input[type="file"] { padding: 6px 8px; border: 1px solid #CDD1D8; border-radius: 5px; background: #FAFBFC; font-size: 13px; cursor: pointer; }
    .btn-primary { background: var(--fb-magenta); color: white; border: none; padding: 10px 28px; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; height: 38px; }
    .btn-primary:hover { background: #c0006a; }
    .btn-primary:disabled { background: #8C96A6; cursor: not-allowed; }

    #status-bar { padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; }
    .status-ok    { background: #E6F4EA; color: #1E6A35; border: 1px solid #A8D5B5; }
    .status-warn  { background: #FFF8E1; color: #7A5800; border: 1px solid #F0D070; }
    .status-error { background: #FDECEA; color: #8B1A1A; border: 1px solid #F0AAAA; }

    #model-section { display: block; }
    #model-section label { font-size: 12px; font-weight: 600; color: var(--fb-navy); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 12px; }
    #model-select { padding: 8px 12px; border: 1px solid #CDD1D8; border-radius: 5px; font-size: 14px; font-weight: 500; min-width: 280px; background: white; cursor: pointer; }

    #diagram-section { display: flex; gap: 20px; align-items: flex-start; }
    #diagram-container { flex: 1 1 auto; min-width: 0; }
    #diagram-wrapper { background: white; border-radius: 8px; border: 1px solid #DDE1E8; padding: 12px; overflow: hidden; }

    .zone-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #444; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    #zone-extra-buttons { margin-top: 10px; }
    .zone-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 5px; border: 2px solid var(--zone-general); background: white; color: var(--zone-general); font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .zone-btn:hover { background: var(--zone-general); color: white; }
    .zone-btn.zone-selected { background: var(--zone-general); color: white; }
    .btn-badge { background: var(--fb-navy); color: white; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
    .zone-btn.zone-selected .btn-badge { background: white; color: var(--fb-navy); }

    #parts-panel { width: 400px; flex-shrink: 0; background: white; border-radius: 8px; border: 1px solid #DDE1E8; display: flex; flex-direction: column; max-height: 520px; }
    #parts-zone-title { padding: 14px 16px 10px; font-size: 15px; font-weight: 700; color: var(--fb-navy); border-bottom: 2px solid var(--fb-magenta); flex-shrink: 0; }
    #parts-table-wrapper { overflow-y: auto; flex: 1; }
    #parts-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #parts-table thead th { position: sticky; top: 0; background: var(--fb-navy); color: white; padding: 8px 10px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    #parts-table thead th.sortable { cursor: pointer; user-select: none; }
    #parts-table thead th.sortable:hover { background: #2A3A70; }
    #parts-table tbody tr:nth-child(even) { background: #F8F9FB; }
    #parts-table tbody tr:hover { background: #EFF1F6; }
    #parts-table tbody td { padding: 7px 10px; border-bottom: 1px solid #EAECF0; vertical-align: top; }
    .issues-count { font-weight: 700; color: var(--fb-navy); text-align: right !important; }
    .no-data { text-align: center !important; color: #8C96A6; padding: 24px !important; font-style: italic; }

    .zone-group { cursor: pointer; opacity: 0.18; transition: opacity 0.2s; }
    .zone-group:hover { opacity: 0.50; }
    .zone-group.zone-selected { opacity: 0.62; }
    #zone-engine     rect, #zone-engine     circle { fill: var(--zone-engine); stroke: #8B1020; stroke-width: 2.5; }
    #zone-brakes     rect, #zone-brakes     circle { fill: var(--zone-brakes); stroke: #1A4A6E; stroke-width: 2.5; }
    #zone-doors      rect, #zone-doors      circle { fill: var(--zone-doors);  stroke: #8A5600; stroke-width: 2.5; }
    #zone-electrical rect, #zone-electrical circle { fill: var(--zone-elec);   stroke: #005548; stroke-width: 2.5; }
    .zone-badge { pointer-events: none; }
    .badge-circle { fill: var(--fb-navy); }
    .badge-text { font-size: 11px; font-weight: 700; fill: white; font-family: 'Segoe UI', Arial, sans-serif; }

    @media (max-width: 900px) {
      #diagram-section { flex-direction: column; }
      #parts-panel { width: 100%; max-height: 400px; }
    }
  </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>

/* === §1 ZONE CONFIGURATION === */
const ZONES = [
  {
    id: 'engine', label: 'Engine & Drivetrain',
    keywords: ['engine','gearbox','transmission','coolant','fuel','exhaust','oil','clutch',
                'propshaft','turbo','injector','pump','radiator','intercooler','crankshaft'],
    svgGroupId: 'zone-engine', badgeId: 'badge-engine',
  },
  {
    id: 'brakes', label: 'Brakes, Wheels & Suspension',
    keywords: ['brake','wheel','tyre','tire','suspension','shock','spring','axle','steering',
                'hub','caliper','bearing','damper','air bag','air spring','bush','track rod'],
    svgGroupId: 'zone-brakes', badgeId: 'badge-brakes',
  },
  {
    id: 'doors', label: 'Doors & Body',
    keywords: ['door','body','window','glass','mirror','seat','panel','trim','cab','bumper',
                'wiper','hinge','step','floor','chassis','frame'],
    svgGroupId: 'zone-doors', badgeId: 'badge-doors',
  },
  {
    id: 'electrical', label: 'Electrical, HVAC & Interior',
    keywords: ['electric','light','lamp','fuse','relay','battery','hvac','air con','heater',
                'fan','interior','sensor','camera','indicator','alternator','starter',
                'wiring','module','controller','display','harness'],
    svgGroupId: 'zone-electrical', badgeId: 'badge-electrical',
  },
  {
    id: 'general', label: 'General / Unclassified',
    keywords: [], svgGroupId: null, badgeId: 'badge-general',
  },
];

/* === §2 COLUMN DETECTION === */
const COL_FLEET_MODEL   = ['type','model','bus type','vehicle type','bus model','bodytype'];
const COL_FLEET_FLEETNO = ['fleet no','fleet number','fleet'];
const COL_FLEET_REG     = ['reg','registration','vrn','regno'];
const COL_TX_FLEETNO    = ['fleet no','fleet number','fleet'];
const COL_TX_MATERIAL   = ['material','material no','material number','part no','part number','article'];
const COL_TX_DESC       = ['description','material desc','material description','short text','part description'];
const COL_TX_GROUP      = ['material group','mat group','group desc','group description','mat grp'];
const COL_TX_QTY        = ['qty','quantity','issued qty','total qty','issue qty','movement qty'];
const COL_TX_DATE       = ['posting date','issue date','date','movement date'];

function normaliseHeader(s) {
  return String(s).toLowerCase().trim().replace(/\s+/g, ' ');
}

function detectColumn(headers, candidates, required) {
  const norm = headers.map(h => ({ raw: h, n: normaliseHeader(h) }));
  for (const c of candidates) {
    const nc = normaliseHeader(c);
    const hit = norm.find(h => h.n === nc);
    if (hit) return hit.raw;
  }
  for (const c of candidates) {
    const nc = normaliseHeader(c);
    const hit = norm.find(h => h.n.includes(nc));
    if (hit) return hit.raw;
  }
  if (required) throw new Error('Required column not found. Tried: ' + candidates.join(', ') + '. Headers seen: ' + headers.join(', '));
  return null;
}

/* === §3 APP STATE & CSV PARSING === */
const AppState = {
  fleetRows: [], txRows: [], fleetCols: {}, txCols: {},
  models: [], selectedModel: null, selectedZone: null,
  aggregated: new Map(), sortAsc: false,
};

function parseCSV(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete(r) {
        if (!r.data || r.data.length === 0) { reject(new Error('"' + file.name + '" has no data rows.')); return; }
        resolve({ headers: r.meta.fields, rows: r.data });
      },
      error(e) { reject(new Error('Parse error in "' + file.name + '": ' + e.message)); },
    });
  });
}

function resolveFleetCols(h) {
  return { model: detectColumn(h, COL_FLEET_MODEL, true), fleetNo: detectColumn(h, COL_FLEET_FLEETNO, true), reg: detectColumn(h, COL_FLEET_REG, false) };
}
function resolveTxCols(h) {
  return { fleetNo: detectColumn(h, COL_TX_FLEETNO, true), material: detectColumn(h, COL_TX_MATERIAL, true),
           desc: detectColumn(h, COL_TX_DESC, true), group: detectColumn(h, COL_TX_GROUP, false),
           qty: detectColumn(h, COL_TX_QTY, true), date: detectColumn(h, COL_TX_DATE, false) };
}

async function handleLoad() {
  const fleetFile = document.getElementById('input-fleet').files[0];
  const txFile    = document.getElementById('input-tx').files[0];
  clearStatus();
  if (!fleetFile || !txFile) { showStatus('error', 'Please select both CSV files before loading.'); return; }
  try {
    setLoadingState(true);
    const [fr, tr] = await Promise.all([parseCSV(fleetFile), parseCSV(txFile)]);
    AppState.fleetCols = resolveFleetCols(fr.headers);
    AppState.txCols    = resolveTxCols(tr.headers);
    AppState.fleetRows = fr.rows;
    AppState.txRows    = tr.rows;
    buildAggregatedData();
    if (AppState.models.length === 0) {
      showStatus('warn', 'No matching fleet numbers found between the two files. Check fleet number column format (e.g. leading zeros).');
      return;
    }
    populateModelDropdown();
    let msg = 'Loaded: ' + AppState.fleetRows.length.toLocaleString() + ' fleet records, ' + AppState.txRows.length.toLocaleString() + ' transactions. ' + AppState.models.length + ' bus model(s) found.';
    if (!AppState.txCols.group) msg += ' Note: no material group column found — all parts will appear in General zone.';
    showStatus(!AppState.txCols.group ? 'warn' : 'ok', msg);
    showSection('model-section');
    hideSection('diagram-section');
  } catch(e) {
    showStatus('error', e.message);
  } finally {
    setLoadingState(false);
  }
}

/* === §4 DATA PROCESSING === */
function buildFleetIndex() {
  const idx = new Map();
  for (const row of AppState.fleetRows) {
    const fn    = String(row[AppState.fleetCols.fleetNo] ?? '').trim();
    const model = String(row[AppState.fleetCols.model]   ?? '').trim();
    if (fn && model) idx.set(fn.toLowerCase(), model);
  }
  return idx;
}

function classifyZone(groupText) {
  const norm = String(groupText ?? '').toLowerCase();
  for (const zone of ZONES) {
    if (zone.id === 'general') continue;
    for (const kw of zone.keywords) { if (norm.includes(kw)) return zone.id; }
  }
  return 'general';
}

function buildAggregatedData() {
  const idx = buildFleetIndex();
  const acc = new Map();
  const { fleetNo: fc, material: mc, desc: dc, group: gc, qty: qc } = AppState.txCols;
  for (const row of AppState.txRows) {
    const qty = parseFloat(String(row[qc] ?? '').replace(/,/g, ''));
    if (isNaN(qty) || qty <= 0) continue;
    const fn    = String(row[fc] ?? '').trim();
    const model = idx.get(fn.toLowerCase());
    if (!model) continue;
    const material = String(row[mc] ?? '').trim();
    const desc     = String(row[dc] ?? '').trim();
    const group    = gc ? String(row[gc] ?? '').trim() : '';
    const zoneId   = classifyZone(group);
    const mk = model.toLowerCase();
    if (!acc.has(mk)) acc.set(mk, new Map());
    const byZone = acc.get(mk);
    if (!byZone.has(zoneId)) byZone.set(zoneId, new Map());
    const byMat = byZone.get(zoneId);
    const matKey = material.toLowerCase();
    if (!byMat.has(matKey)) byMat.set(matKey, { material, desc, group, issues: 0 });
    byMat.get(matKey).issues += qty;
  }
  AppState.aggregated = new Map();
  for (const [mk, byZone] of acc) {
    const zm = new Map();
    for (const [zid, byMat] of byZone) {
      zm.set(zid, Array.from(byMat.values()).sort((a, b) => b.issues - a.issues));
    }
    AppState.aggregated.set(mk, zm);
  }
  AppState.models = Array.from(AppState.aggregated.keys()).map(k => {
    const row = AppState.fleetRows.find(r => String(r[AppState.fleetCols.model] ?? '').toLowerCase() === k);
    return row ? String(row[AppState.fleetCols.model]).trim() : k;
  }).sort((a, b) => a.localeCompare(b));
}

function populateModelDropdown() {
  const sel = document.getElementById('model-select');
  sel.innerHTML = '<option value="">-- Select bus model --</option>';
  for (const m of AppState.models) {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    sel.appendChild(o);
  }
}

function handleModelChange(evt) {
  const model = evt.target.value;
  if (!model) { hideSection('diagram-section'); return; }
  AppState.selectedModel = model;
  AppState.selectedZone  = null;
  AppState.sortAsc       = false;
  document.querySelectorAll('.zone-group').forEach(g => g.classList.remove('zone-selected'));
  document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('zone-selected'));
  showSection('diagram-section');
  renderDiagram();
  clearPartsPanel();
}

/* === §5 SVG DIAGRAM === */
function wireZoneInteractions() {
  document.querySelectorAll('.zone-group').forEach(g => {
    g.addEventListener('click', () => selectZone(g.dataset.zone));
  });
  document.querySelectorAll('.zone-btn').forEach(btn => {
    btn.addEventListener('click', () => selectZone(btn.dataset.zone));
  });
}

function selectZone(zoneId) {
  if (AppState.selectedZone) {
    const prev = document.getElementById('zone-' + AppState.selectedZone);
    if (prev) prev.classList.remove('zone-selected');
    const prevBtn = document.querySelector('.zone-btn[data-zone="' + AppState.selectedZone + '"]');
    if (prevBtn) prevBtn.classList.remove('zone-selected');
  }
  AppState.selectedZone = zoneId;
  AppState.sortAsc = false;
  updateSortIndicator();
  const svgG = document.getElementById('zone-' + zoneId);
  if (svgG) svgG.classList.add('zone-selected');
  const btn = document.querySelector('.zone-btn[data-zone="' + zoneId + '"]');
  if (btn) btn.classList.add('zone-selected');
  renderPartsPanel(zoneId);
}

function renderDiagram() {
  const mk      = AppState.selectedModel.toLowerCase();
  const zoneMap = AppState.aggregated.get(mk) ?? new Map();
  for (const zone of ZONES) {
    const count = (zoneMap.get(zone.id) ?? []).length;
    const badge = document.getElementById(zone.badgeId);
    if (!badge) continue;
    if (zone.id === 'general') {
      badge.textContent = count;
      const btn = document.getElementById('btn-general');
      if (btn) btn.style.display = count > 0 ? '' : 'none';
    } else {
      const txt = badge.querySelector('.badge-text');
      if (txt) txt.textContent = count;
      badge.setAttribute('visibility', count > 0 ? 'visible' : 'hidden');
    }
  }
}

/* === §6 PARTS PANEL === */
function renderPartsPanel(zoneId) {
  const zone    = ZONES.find(z => z.id === zoneId);
  const mk      = AppState.selectedModel?.toLowerCase();
  const allRows = AppState.aggregated.get(mk)?.get(zoneId) ?? [];
  document.getElementById('parts-zone-title').textContent = zone?.label ?? zoneId;
  const rows  = AppState.sortAsc ? [...allRows].sort((a, b) => a.issues - b.issues) : allRows;
  const tbody = document.getElementById('parts-tbody');
  tbody.innerHTML = '';
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="no-data">No parts data for this zone and model.</td></tr>';
    return;
  }
  for (const row of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + escHtml(row.material) + '</td>' +
      '<td>' + escHtml(row.desc)     + '</td>' +
      '<td>' + escHtml(row.group)    + '</td>' +
      '<td class="issues-count">' + Math.round(row.issues) + '</td>';
    tbody.appendChild(tr);
  }
}

function clearPartsPanel() {
  document.getElementById('parts-zone-title').textContent = 'Select a zone';
  document.getElementById('parts-tbody').innerHTML = '<tr><td colspan="4" class="no-data">Click a zone on the diagram.</td></tr>';
}

function updateSortIndicator() {
  const th = document.getElementById('th-issues');
  if (th) th.innerHTML = 'Issues ' + (AppState.sortAsc ? '&#9650;' : '&#9660;');
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* === §7 UI UTILITIES === */
function showSection(id) { document.getElementById(id).classList.remove('hidden'); }
function hideSection(id) { document.getElementById(id).classList.add('hidden'); }

function showStatus(type, msg) {
  const bar = document.getElementById('status-bar');
  bar.className = 'status-' + type;
  bar.textContent = msg;
  bar.classList.remove('hidden');
}
function clearStatus() {
  const bar = document.getElementById('status-bar');
  bar.className = ''; bar.textContent = '';
  bar.classList.add('hidden');
}
function setLoadingState(on) {
  const btn = document.getElementById('btn-load');
  btn.disabled = on; btn.textContent = on ? 'Loading…' : 'Load';
}

/* === §8 INIT === */
document.addEventListener('DOMContentLoaded', () => {
  wireZoneInteractions();
  document.getElementById('btn-load').addEventListener('click', handleLoad);
  document.getElementById('model-select').addEventListener('change', handleModelChange);
  document.getElementById('th-issues').addEventListener('click', () => {
    if (!AppState.selectedZone) return;
    AppState.sortAsc = !AppState.sortAsc;
    updateSortIndicator();
    renderPartsPanel(AppState.selectedZone);
  });
});

</script>
</body>
</html>
